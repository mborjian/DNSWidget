name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  HAS_DEV_ACCOUNT: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 != '' && secrets.APPLE_API_KEY_ID != '' }}

jobs:
  build:
    name: Build DNSWidget
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Releasing version $VERSION"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Sources/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Sources/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Sources/Widget/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Sources/Widget/Info.plist

      - name: Build release
        env:
          HAS_DEV_ACCOUNT: ${{ env.HAS_DEV_ACCOUNT }}
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          if [ "$HAS_DEV_ACCOUNT" = "true" ]; then
            echo "$DEVELOPER_ID_CERT_P12_BASE64" | base64 -d > /tmp/developer-id.p12
            security create-keychain -p build build.keychain
            security default-keychain -s build.keychain
            security unlock-keychain -p build build.keychain
            security import /tmp/developer-id.p12 -k build.keychain -P "$DEVELOPER_ID_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k build build.keychain
            CERT_ID="$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
            echo "Signing with certificate: $CERT_ID"
            xcodebuild \
              -project DNSWidget.xcodeproj \
              -scheme DNSWidget \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="$CERT_ID" \
              OTHER_CODE_SIGN_FLAGS="--options runtime" \
              ENABLE_HARDENED_RUNTIME=YES \
              CODE_SIGN_ENTITLEMENTS= \
              build
          else
            xcodebuild \
              -project DNSWidget.xcodeproj \
              -scheme DNSWidget \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=YES \
              CODE_SIGN_ENTITLEMENTS= \
              build
          fi

      - name: Notarize
        if: env.HAS_DEV_ACCOUNT == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 -d > /tmp/AuthKey_$APPLE_API_KEY_ID.p8
          cd build/Build/Products/Release
          ditto -c -k --keepParent DNSWidget.app DNSWidget-notarize.zip
          xcrun notarytool submit DNSWidget-notarize.zip \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_KEY_ISSUER_ID" \
            --key "/tmp/AuthKey_$APPLE_API_KEY_ID.p8" \
            --wait
          xcrun stapler staple DNSWidget.app
          rm DNSWidget-notarize.zip

      - name: Package disk image
        env:
          HAS_DEV_ACCOUNT: ${{ env.HAS_DEV_ACCOUNT }}
        run: |
          cd build/Build/Products/Release
          STAGE="$(mktemp -d)"
          cp -R DNSWidget.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "DNS Widget" \
            -srcfolder "$STAGE" \
            -fs HFS+ \
            -format UDZO \
            -ov \
            DNSWidget-macOS.dmg
          rm -rf "$STAGE"
          if [ "$HAS_DEV_ACCOUNT" = "true" ]; then
            CERT_ID="$(security find-identity -v -p codesigning | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
            echo "Signing disk image with certificate: $CERT_ID"
            codesign --force --sign "$CERT_ID" --timestamp DNSWidget-macOS.dmg
            codesign --verify --verbose=2 DNSWidget-macOS.dmg
          fi

      - name: Notarize disk image
        if: env.HAS_DEV_ACCOUNT == 'true'
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_ISSUER_ID: ${{ secrets.APPLE_API_KEY_ISSUER_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_P8_BASE64" | base64 -d > /tmp/AuthKey_$APPLE_API_KEY_ID.p8
          cd build/Build/Products/Release
          xcrun notarytool submit DNSWidget-macOS.dmg \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_KEY_ISSUER_ID" \
            --key "/tmp/AuthKey_$APPLE_API_KEY_ID.p8" \
            --wait
          xcrun stapler staple DNSWidget-macOS.dmg
          xcrun stapler validate DNSWidget-macOS.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DNSWidget-macOS
          path: build/Build/Products/Release/DNSWidget-macOS.dmg
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Build/Products/Release/DNSWidget-macOS.dmg
          generate_release_notes: true