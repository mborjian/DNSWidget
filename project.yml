name: DNSWidget
options:
  bundleIdPrefix: com.dnswidget
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "M53HVUGHM2"

schemes:
  DNSWidget:
    build:
      targets:
        DNSWidget: all
    run:
      config: Debug

targets:
  DNSWidget:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      - path: Sources/Models
      - path: Sources/Design
      - path: Sources/Views
      - path: Sources/Services
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dnswidget
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/DNSWidget.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    dependencies:
      - target: DNSWidgetExtension
        embed: true
        codeSign: true

  DNSWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/Widget
      - path: Sources/Services/WidgetDataManager.swift
      - path: Sources/Services/DNSWidgetIntents.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dnswidget.widget
        INFOPLIST_FILE: Sources/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Widget/DNSWidgetExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @executable_path/../../../../Frameworks"
    dependencies: []
